name: Deploy Komunitas (Cloudflare Pages)

on:
  workflow_dispatch:
  push:
    branches: [deploy-komunitas]

concurrency:
  group: pages-deploy-clincoo-komunitas
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Komunitas
        uses: actions/checkout@v4
        with:
          repository: muzawwied/Clincoo-Komunitas
          ref: main

      - name: Bersihkan artefak repo (tidak ikut di-publish)
        run: rm -rf .git .github tests node_modules .wrangler package.json package-lock.json .gitignore

      - name: Pasang wrangler
        run: npm install -g wrangler

      - name: Deploy ke Cloudflare Pages
        run: npx wrangler pages deploy . --project-name=clincoo-komunitas --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
